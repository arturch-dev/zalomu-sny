<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успішна | Світлана Гаврилюк</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#9A5C5A', 
                        brandHover: '#7A4746',
                        bgLight: '#F4F1EB', 
                        dark: '#2D2D2D'
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1548773689373078'); 
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1548773689373078&ev=PageView&noscript=1"/></noscript>
    <!-- End Meta Pixel Code -->
</head>
<body class="bg-bgLight text-dark font-sans antialiased">

    <!-- ЕКРАН УСПІШНОЇ ОПЛАТИ (Схований за замовчуванням) -->
    <div id="thankYouBlock" class="hidden min-h-screen flex items-center justify-center px-4 py-12">
        <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center border-t-8 border-brand">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle" class="w-10 h-10 text-green-500"></i>
            </div>
            <h2 class="text-3xl font-black mb-4 text-dark uppercase">Оплата успішна!</h2>
            <p class="text-lg text-gray-600 mb-8 font-medium">Дякуємо за довіру. Натискай на кнопку нижче і швидше переходь до навчання у нашому Telegram-боті.</p>
            
            <a href="https://t.me/zalomy_snu_bot?start=69ca5b0b816011f88c0ff77b" class="inline-block w-full bg-brand hover:bg-brandHover text-white font-black py-5 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 text-xl uppercase tracking-wider">
                Перейти до навчання
            </a>
            
            <p id="orderIdDisplay" class="mt-6 text-sm text-gray-400 font-mono"></p>
        </div>
    </div>

    <!-- ЕКРАН "ДОСТУП ЗАКРИТО" (Схований за замовчуванням) -->
    <div id="errorBlock" class="hidden min-h-screen flex items-center justify-center px-4 py-12">
        <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center border-t-8 border-red-500">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="x-circle" class="w-10 h-10 text-red-500"></i>
            </div>
            <h2 class="text-3xl font-black mb-4 text-dark uppercase">Доступ закрито</h2>
            <p class="text-lg text-gray-600 mb-8 font-medium">Схоже, ви не здійснили оплату або перейшли за неправильним посиланням.</p>
            
            <a href="index.html" class="inline-block w-full bg-gray-800 hover:bg-black text-white font-black py-5 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 text-lg uppercase tracking-wider">
                Повернутись на головну
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener("DOMContentLoaded", () => {
            // Отримуємо параметри з URL
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('order_id');
            const status = urlParams.get('status');
            const price = urlParams.get('price');

            const thankYouBlock = document.getElementById('thankYouBlock');
            const errorBlock = document.getElementById('errorBlock');

            // ПЕРЕВІРКА: 
            // 1. Чи є order_id
            // 2. Чи починається order_id з "ZALOMY_" (як ми генеруємо в index.html)
            // 3. Чи є статус success
            if (orderId && orderId.startsWith('ZALOMY_') && status === 'success') {
                
                // Якщо все добре — показуємо екран успіху
                thankYouBlock.classList.remove('hidden');
                
                // Виводимо номер замовлення для клієнта (за бажанням)
                document.getElementById('orderIdDisplay').innerText = `Замовлення: ${orderId}`;

                // Відправляємо подію Purchase у Facebook Pixel
                if(typeof fbq === 'function' && price) {
                    fbq('track', 'Purchase', {value: Number(price), currency: 'UAH'});
                }

                // ==========================================
                // НОВИЙ КОД: ОНОВЛЕННЯ СТАТУСУ В ТАБЛИЦІ
                // ==========================================
                const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvtFJOcJ_d3qWKriB88eCIQqih4JNK-bruaxfjlrDvMeTLLW1Cpq9xB2PkmLrIbjibUQ/exec"; 

                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'update_payment',
                        order_id: orderId,
                        price_chosen: price
                    })
                });
                // ==========================================

            } else {
                // Якщо людина просто зайшла на сторінку — показуємо помилку
                errorBlock.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
